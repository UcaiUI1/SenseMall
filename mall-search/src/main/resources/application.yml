spring:
  application:
    name: mall-search
  profiles:
    active: dev #默认为开发环境
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8081

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml

springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /swagger-ui.html
    # 开启Swagger UI界面
    enabled: true
    # 用于配置tag和operation的展开方式，这里配置为都不展开
    doc-expansion: 'none'
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
  group-configs:
    - group: 'mall-search'
      packages-to-scan: com.macro.mall.search.controller

# 语义搜索配置
mall:
  search:
    embedding:
      api-key: ${DASHSCOPE_API_KEY:}
      model: text-embedding-v3
    sync:
      enabled: true # 是否开启定时增量同步
      interval-ms: 900000 # 同步间隔（默认 15 分钟）
      initial-delay-ms: 60000 # 启动后延迟（默认 1 分钟）



